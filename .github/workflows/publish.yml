name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish?'
        required: true
        type: choice
        options:
          - both
          - tokens-only
          - react-only
          - cli-only
          - all

jobs:
  publish-tokens:
    if: inputs.package == 'both' || inputs.package == 'tokens-only' || inputs.package == 'all'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5+ caches automatically when package.json has packageManager;
          # a restored cache in a job holding an OIDC token is a poisoning path.
          package-manager-cache: false

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      # Exact version, not `npm@11`, so a release never runs an npm published hours ago.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version

      - name: Publish @7onic-ui/tokens
        working-directory: tokens
        run: npm publish --access public --provenance

  publish-react:
    needs: publish-tokens
    if: always() && (inputs.package == 'both' || inputs.package == 'react-only' || inputs.package == 'all') && (needs.publish-tokens.result == 'success' || needs.publish-tokens.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5+ caches automatically when package.json has packageManager;
          # a restored cache in a job holding an OIDC token is a poisoning path.
          package-manager-cache: false

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      # Exact version, not `npm@11`, so a release never runs an npm published hours ago.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build component library
        run: npm run build:lib

      - name: Publish @7onic-ui/react
        run: npm publish --access public --provenance

  publish-cli:
    if: inputs.package == 'cli-only' || inputs.package == 'all'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5+ caches automatically when package.json has packageManager;
          # a restored cache in a job holding an OIDC token is a poisoning path.
          package-manager-cache: false

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      # Exact version, not `npm@11`, so a release never runs an npm published hours ago.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.1 && npm --version

      - name: Publish 7onic (CLI)
        working-directory: cli
        run: npm publish --access public --provenance
