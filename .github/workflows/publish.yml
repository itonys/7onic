name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish?'
        required: true
        type: choice
        options:
          - both
          - tokens-only
          - react-only
          - cli-only
          - all

jobs:
  publish-tokens:
    if: inputs.package == 'both' || inputs.package == 'tokens-only' || inputs.package == 'all'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Publish @7onic-ui/tokens
        working-directory: tokens
        run: npm publish --access public --provenance

  publish-react:
    needs: publish-tokens
    if: always() && (inputs.package == 'both' || inputs.package == 'react-only' || inputs.package == 'all') && (needs.publish-tokens.result == 'success' || needs.publish-tokens.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build component library
        run: npm run build:lib

      - name: Publish @7onic-ui/react
        run: npm publish --access public --provenance

  publish-cli:
    if: inputs.package == 'cli-only' || inputs.package == 'all'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 bundles 10.x.
      # Pinned to the 11.x line: npm 12+ requires node >= 22 (measured 2026-10-08).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 && npm --version

      - name: Publish 7onic (CLI)
        working-directory: cli
        run: npm publish --access public --provenance
